[Application]
; 版本号唯一来源。tools/build_installer.py 读它，再传给安装包脚本，
; 所以改版本只需要改这一处。
version = 2.1.0

[Update]
server = https://frp-fun.com:56198

[Security]
; 完整性校验用的哈希。留空 = 跳过校验。
; 每次重新打包 exe 的哈希都会变，构建流程最后跑一次：
;     python tools/gen_hashes.py --dist <产物目录>
; 它会自动算好写回这里，校验随即生效。
mainfilehashe_x86 = ""
mainfilehashe_x64 = ""
; ui/ 目录的清单哈希（同样由 gen_hashes.py 生成）
uibundlehashe = ""

[ProjectManager]
projectmanager = LiYu

[Author]
author = GWJ

